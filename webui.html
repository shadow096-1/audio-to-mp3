<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>音频转 MP3 · 懒人包</title><style>
:root{--bg:#f4f5ef;--ink:#192d28;--muted:#697871;--green:#2e6251;--line:#dce2d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}main{max-width:1060px;margin:0 auto;padding:38px 28px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:1px}.logo{width:36px;height:36px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font-size:24px}.pill{font-size:12px;border:1px solid var(--line);border-radius:30px;padding:8px 12px;color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:700}h1{font-size:44px;letter-spacing:-1.5px;margin:14px 0 12px;font-weight:700}p{color:var(--muted);line-height:1.8;margin:0}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}.quality{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px}select{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}button,.link{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.link:hover{background:#eef2ec}button.primary{background:var(--green);border-color:var(--green);color:white}.drop{background:white;border:1.5px dashed #b6c6b7;border-radius:18px;text-align:center;padding:42px 20px}.drop.over{background:#e8f2e9;border-color:var(--green)}.icon{color:var(--green);font-size:35px}.drop h2{font-size:19px;margin:14px 0 8px}.actions{display:flex;justify-content:center;gap:10px;margin-top:20px}.note{font-size:12px;margin-top:18px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.toolbar h2{font-size:17px;margin:0}.secondary{display:flex;gap:8px}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.empty{text-align:center;padding:36px;color:var(--muted);font-size:13px}.row{display:grid;grid-template-columns:1fr 210px;gap:18px;padding:19px 22px;border-bottom:1px solid #edf0e9}.row:last-child{border-bottom:0}.filename{font-size:14px;font-weight:600;overflow-wrap:anywhere}.detail{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap;max-height:150px;overflow:auto}.right{display:flex;align-items:start;justify-content:end;flex-wrap:wrap;gap:8px}.state{font-size:12px;padding:6px 10px;border-radius:6px;background:#eef3ed;color:var(--green)}.state.failed{background:#fff0e4;color:#9c5827}.state.converting{background:#e6f0f5;color:#366473}.state.cancelled{background:#f1f1ee;color:#777}.small{font-size:12px;padding:6px 10px}footer{font-size:12px;color:var(--muted);line-height:1.9;margin-top:22px}.path{overflow-wrap:anywhere;color:var(--green)}#notice{margin:16px 0 0;border-radius:9px;background:#fff0e4;color:#82552e;padding:12px 16px;font-size:13px;display:none}dialog{border:1px solid var(--line);border-radius:16px;padding:26px;width:min(550px,90vw);color:var(--ink)}dialog::backdrop{background:#10251d70}dialog h2{font-size:20px;margin:0 0 12px}textarea{width:100%;height:110px;margin:14px 0;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:monospace;resize:vertical}.dialog-actions{display:flex;justify-content:end;gap:8px}.summary{font-size:12px;color:var(--muted);margin-left:12px}button:disabled{opacity:.5;cursor:default}@media(max-width:650px){main{padding:24px 18px}.hero{display:block}h1{font-size:34px}.quality{margin-top:18px}.row{grid-template-columns:1fr}.right{justify-content:start}.toolbar{align-items:start;gap:12px}.secondary{flex-wrap:wrap;justify-content:end}.top{margin-bottom:26px}}

.top{gap:18px;flex-wrap:wrap}.top-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.language{display:flex;align-items:center;gap:8px;font-size:13px}.hero>div{min-width:0}.toolbar{gap:16px;flex-wrap:wrap}.secondary{flex-wrap:wrap}.summary{display:inline-block}.actions{flex-wrap:wrap}.row{grid-template-columns:minmax(0,1fr) minmax(180px,260px)}h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.5px}.top select{max-width:190px}@media(max-width:650px){.top-controls{width:100%;justify-content:space-between}.row{grid-template-columns:minmax(0,1fr)}.toolbar .secondary{justify-content:start}.quality{white-space:normal}}

.top{gap:18px;flex-wrap:wrap}.top-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.language{display:flex;align-items:center;gap:8px;font-size:13px}.hero>div{min-width:0}.toolbar{gap:16px;flex-wrap:wrap}.secondary{flex-wrap:wrap}.summary{display:inline-block}.actions{flex-wrap:wrap}.row{grid-template-columns:minmax(0,1fr) minmax(180px,260px)}h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.5px}.top select{max-width:190px}@media(max-width:650px){.top-controls{width:100%;justify-content:space-between}.row{grid-template-columns:minmax(0,1fr)}.toolbar .secondary{justify-content:start}.quality{white-space:normal}}
</style></head><body><main>
<div class="top"><div class="brand"><div class="logo">♫</div><span data-i18n="brand">音频转 MP3</span></div><div class="top-controls"><span class="pill"><span data-i18n="pill">本地转换 · 自动取钥</span> · v__APP_VERSION__</span><label class="language"><span data-i18n="language">语言</span><select id="language" aria-label="Language"><option value="zh-CN" lang="zh-CN">简体中文</option><option value="zh-TW" lang="zh-TW">繁體中文</option><option value="en" lang="en">English</option><option value="ja" lang="ja">日本語</option></select></label></div></div>
<div class="hero"><div><div class="eyebrow">YOUR MUSIC, YOUR DEVICE</div><h1 data-i18n="hero">拖入音乐，自动转换。</h1><p><span data-i18n="intro"></span><br><span data-i18n="formats"></span></p></div><label class="quality"><span data-i18n="bitrate"></span><select id="quality"><option>128</option><option>192</option><option>256</option><option selected>320</option></select> kbps</label></div>
<div class="drop" id="drop"><div class="icon">↥</div><h2 data-i18n="drop"></h2><p data-i18n="dropHint"></p><div class="actions"><button class="primary" id="pick" data-i18n="pick"></button><button id="folderPick" data-i18n="folderPick"></button></div><div class="note" data-i18n="localNote"></div></div>
<div class="note" style="margin:12px 4px 0"><label><input type="checkbox" id="autoKey" checked> <span data-i18n="autoKey"></span></label> · <span data-i18n="autoNote"></span></div>
<input id="files" type="file" multiple hidden><input id="folder" type="file" webkitdirectory multiple hidden>
<div id="notice" role="status" aria-live="polite"></div>
<div class="toolbar"><h2><span data-i18n="jobs"></span><span class="summary" id="summary" data-i18n="waiting"></span></h2><div class="secondary"><button id="openFolder" data-i18n="openFolder"></button><button id="cancel" data-i18n="cancel"></button><button id="exit" data-i18n="exit"></button></div></div>
<div class="card" id="list"><div class="empty" data-i18n="empty"></div></div>
<footer><span data-i18n="output"></span> <span class="path" id="output" data-i18n="connecting"></span><br><span data-i18n="privacy"></span><br><span data-i18n="lossy"></span></footer>
</main>
<dialog id="keyDialog"><h2 data-i18n="keyTitle"></h2><p id="keyName"></p><p data-i18n="keyHint"></p><textarea id="ekey"></textarea><p id="keyError" style="color:#9c5827;font-size:12px"></p><div class="dialog-actions"><button id="keyCancel" data-i18n="keyCancel"></button><button class="primary" id="keySubmit" data-i18n="keySubmit"></button></div></dialog>
<script id="localeData" type="application/json">__APP_TRANSLATIONS__</script>
<script>
'use strict';
const TOKEN='__APP_TOKEN__', $=id=>document.getElementById(id);
const CATALOG=JSON.parse($('localeData').textContent), PREFERRED_LANGUAGE=__APP_PREFERRED_LANGUAGE__;
function normalizeLanguage(value){const v=String(value||'').toLowerCase().replaceAll('_','-');if(/^zh-(tw|hk|mo)(-|$)/.test(v)||v.startsWith('zh-hant'))return 'zh-TW';if(v==='zh'||/^zh-(cn|sg)(-|$)/.test(v)||v.startsWith('zh-hans'))return 'zh-CN';if(/^en(-|$)/.test(v))return 'en';if(/^ja(-|$)/.test(v))return 'ja';return null}
function initialLanguage(){if(CATALOG[PREFERRED_LANGUAGE])return PREFERRED_LANGUAGE;try{const saved=localStorage.getItem('audio-to-mp3-language');if(CATALOG[saved])return saved}catch(_){}for(const v of navigator.languages||[navigator.language]){const lang=normalizeLanguage(v);if(lang)return lang}return 'en'}
let language=initialLanguage(),activeKey=null,uploading=false,stopped=false,stopUploads=false,lastRender='',lastState=null,notice=null,keyError=null;
const messagePatterns={};
function t(key,params={}){const template=CATALOG[language]?.ui[key]??CATALOG.en.ui[key]??key;return template.replace(/\{(\w+)\}/g,(match,key)=>Object.hasOwn(params,key)?String(params[key]):match)}
function translateMessage(text){if(!text||language==='zh-CN')return text||'';const messages=CATALOG[language]?.messages||CATALOG.en.messages;if(!messagePatterns[language]){const escape=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');messagePatterns[language]=new RegExp(Object.keys(messages).sort((a,b)=>b.length-a.length).map(escape).join('|'),'g')}return String(text).replace(messagePatterns[language],m=>messages[m])}
function errorText(error){return translateMessage(error?.source||error?.message||String(error))}
function renderNotice(){const text=notice?(notice.error?notice.prefix+errorText(notice.error):t(notice.key,notice.params)):'';$('notice').textContent=text;$('notice').style.display=text?'block':'none'}
function notify(key,params={}){notice=key?{key,params}:null;renderNotice()}
function notifyError(error,prefix=''){notice={error,prefix};renderNotice()}
function applyLanguage(){document.documentElement.lang=language;document.title=t('title')+' · v__APP_VERSION__';$('language').value=language;$('language').setAttribute('aria-label',t('language'));$('quality').setAttribute('aria-label',t('bitrate'));document.querySelectorAll('[data-i18n]').forEach(n=>{if((n.id==='output'||n.id==='summary')&&lastState)return;n.textContent=t(n.dataset.i18n)});$('ekey').placeholder=t('keyPlaceholder');$('ekey').setAttribute('aria-label',t('keyLabel'));if(lastState){lastRender='';render(lastState)}renderNotice();$('keyError').textContent=keyError?errorText(keyError):''}
function appError(value,fallback){const e=new Error(value.error||t(fallback));e.source=value.error_source||value.error||t(fallback);return e}
const supported=/\.(ncm|mflac\d?|mgg\d?|qmc\d|qmcflac|qmcogg|qmcra|mp3|flac|wav|ogg|m4a|aac|opus|wma|aiff|ape)$/i;
async function api(path,data){const r=await fetch(path,{method:data===undefined?'GET':'POST',headers:{'X-App-Token':TOKEN,'X-App-Language':language,'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const value=await r.json();if(!r.ok)throw appError(value,'operationFailed');return value}
let languageSave=Promise.resolve();
$('language').onchange=async()=>{language=$('language').value;const selected=language;try{localStorage.setItem('audio-to-mp3-language',language)}catch(_){}applyLanguage();try{languageSave=languageSave.catch(()=>{}).then(()=>api('/language',{language:selected}));await languageSave}catch(_){notify('languageSaveFailed')}if(!stopped)refresh()};
function element(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function render(state){lastState=state;$('output').textContent=state.output;const jobs=state.jobs;const complete=jobs.filter(j=>j.status==='done').length,failed=jobs.filter(j=>j.status==='failed').length;$('summary').textContent=t('summary',{total:jobs.length,done:complete,failed});
const value=language+JSON.stringify(jobs);if(value===lastRender)return;lastRender=value;const list=$('list');list.replaceChildren();if(!jobs.length){list.append(element('div','empty',t('empty')));return}
for(const job of jobs){const row=element('div','row'),left=element('div'),right=element('div','right');left.append(element('div','filename',job.name));let detail=translateMessage(job.message_source||job.message||'');if(job.info)detail+='\n'+t('resource',{version:job.info.version,resource:job.info.resource_name});if(job.result)detail+=' · '+job.result;left.append(element('div','detail',detail));right.append(element('span','state '+job.status,t(job.status)));
if(job.status==='done'){const a=element('a','link small',t('download'));a.href=`/download?id=${encodeURIComponent(job.id)}&token=${encodeURIComponent(TOKEN)}`;a.download=job.result;right.append(a)}
if(['failed','cancelled'].includes(job.status)){if(job.info){const auto=element('button','small',t('retryAuto'));auto.onclick=async()=>{try{await api('/retry',{id:job.id,auto:true});refresh()}catch(e){notifyError(e)}};right.append(auto)}const b=element('button','small',t(job.info?'keyEnter':'retry'));b.onclick=async()=>{if(job.info){activeKey=job.id;$('keyName').textContent=job.name;$('ekey').value='';keyError=null;$('keyError').textContent='';$('keyDialog').showModal()}else{try{await api('/retry',{id:job.id});refresh()}catch(e){notifyError(e)}}};right.append(b)}row.append(left,right);list.append(row)}
}
async function refresh(){if(stopped)return;const requestedLanguage=language;try{const state=await api('/status');if(requestedLanguage===language)render(state)}catch(e){if(!uploading&&requestedLanguage===language)notify('disconnected')}}
async function addFiles(input){if(stopped)return;if(uploading){notify('uploadBusy');return}const files=Array.from(input).filter(f=>supported.test(f.name));if(!files.length){notify('noFiles');return}uploading=true;stopUploads=false;$('exit').disabled=true;const bitrate=$('quality').value;$('pick').disabled=$('folderPick').disabled=true;try{for(let i=0;i<files.length;i++){if(stopUploads)break;const file=files[i];notify('uploading',{index:i+1,total:files.length,name:file.name});try{const r=await fetch(`/upload?name=${encodeURIComponent(file.name)}&bitrate=${bitrate}&auto=${$('autoKey').checked?'1':'0'}`,{method:'POST',headers:{'X-App-Token':TOKEN,'X-App-Language':language,'Content-Type':'application/octet-stream'},body:file});const v=await r.json();if(!r.ok)throw appError(v,'uploadFailed');await refresh();if(stopUploads)await api('/cancel',{})}catch(e){notifyError(e,file.name+' · ');throw e}}notify('')}catch(e){/* Keep the failure message visible. */}finally{uploading=false;$('exit').disabled=false;$('pick').disabled=$('folderPick').disabled=false}}
$('pick').onclick=()=>$('files').click();$('folderPick').onclick=()=>$('folder').click();$('files').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('folder').onchange=e=>{addFiles(e.target.files);e.target.value=''};
for(const name of ['dragenter','dragover'])$('drop').addEventListener(name,e=>{e.preventDefault();$('drop').classList.add('over')});for(const name of ['dragleave','drop'])$('drop').addEventListener(name,e=>{e.preventDefault();$('drop').classList.remove('over')});$('drop').addEventListener('drop',e=>addFiles(e.dataTransfer.files));
$('cancel').onclick=async()=>{stopUploads=true;try{await api('/cancel',{});notify('cancelRequested');refresh()}catch(e){notifyError(e)}};$('openFolder').onclick=async()=>{try{await api('/folder',{})}catch(e){notifyError(e)}};
$('keyCancel').onclick=()=>$('keyDialog').close();$('keySubmit').onclick=async()=>{try{await api('/retry',{id:activeKey,ekey:$('ekey').value.trim()});$('ekey').value='';$('keyDialog').close();keyError=null;refresh()}catch(e){keyError=e;$('keyError').textContent=errorText(e)}};
$('exit').onclick=async()=>{try{await api('/shutdown',{});stopped=true;notify('stopped');$('pick').disabled=$('folderPick').disabled=true}catch(e){notifyError(e)}};
applyLanguage();refresh();setInterval(refresh,800);
</script></body></html>
